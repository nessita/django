name: PR Quality Checks

on:
  pull_request_target:
    types: [ edited, opened, reopened, ready_for_review, synchronize ]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  pr_quality:
    # Only trigger on the main Django repository
    # if: github.repository == 'django/django'
    name: Run Quality Checks on a PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run PR quality checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PYTHONPATH: scripts
        run: |
          python scripts/pr_quality/check_pr.py \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}"

name: Shell exit code probe

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Write a make.bat-shaped stub that fails
        shell: bash
        run: |
          printf '@ECHO OFF\r\n' > stub.bat
          printf 'if "%%1" == "lint" (\r\n' >> stub.bat
          printf '\tcall :run_lint\r\n' >> stub.bat
          printf '\tgoto end\r\n' >> stub.bat
          printf ')\r\n' >> stub.bat
          printf ':run_lint\r\n' >> stub.bat
          printf '\tcmd /c exit 3\r\n' >> stub.bat
          printf '\tif errorlevel 1 exit /b 1\r\n' >> stub.bat
          printf ':end\r\n' >> stub.bat

      - name: A. shell cmd, batch (what the PR does)
        id: a
        continue-on-error: true
        shell: cmd  # zizmor: ignore[misfeature]
        run: .\stub.bat lint

      - name: B. pwsh, cmd /c batch
        id: b
        continue-on-error: true
        run: cmd /c stub.bat lint

      - name: C. pwsh, batch directly
        id: c
        continue-on-error: true
        run: .\stub.bat lint

      - name: D. pwsh, native exe only (no batch)
        id: d
        continue-on-error: true
        run: cmd /c exit 3

      - name: E. pwsh, python (mirrors sphinx-extension-tests)
        id: e
        continue-on-error: true
        run: python -c "raise SystemExit(3)"

      - name: F. pwsh, batch with explicit exit
        id: f
        continue-on-error: true
        run: |
          .\stub.bat lint
          exit $LASTEXITCODE

      - name: Report
        if: always()
        shell: bash
        env:
          A_OUTCOME: ${{ steps.a.outcome }}
          B_OUTCOME: ${{ steps.b.outcome }}
          C_OUTCOME: ${{ steps.c.outcome }}
          D_OUTCOME: ${{ steps.d.outcome }}
          E_OUTCOME: ${{ steps.e.outcome }}
          F_OUTCOME: ${{ steps.f.outcome }}
        run: |
          echo "A shell cmd, batch        -> $A_OUTCOME"
          echo "B pwsh, cmd /c batch      -> $B_OUTCOME"
          echo "C pwsh, batch direct      -> $C_OUTCOME"
          echo "D pwsh, native exe        -> $D_OUTCOME"
          echo "E pwsh, python            -> $E_OUTCOME"
          echo "F pwsh, explicit exit     -> $F_OUTCOME"
          echo
          echo "Expected if pwsh is fine with non-batch: D and E are failure."
          [ "$E_OUTCOME" = failure ] \
            || echo "WARNING: sphinx-extension-tests on Windows cannot fail."
